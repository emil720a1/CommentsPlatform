name: Backend CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore CommentsPlatform.slnx

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"emil720a1_CommentsPlatform"
          /o:"emil720a1"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/Unit/**/coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="TestResults/Unit/*.trx"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**,**/*.g.cs,**/*.Designer.cs,TestResults/**"

      - name: Build solution
        run: >
          dotnet build CommentsPlatform.slnx
          --configuration Release
          --no-restore

      - name: Run Domain unit tests with coverage
        run: >
          dotnet test
          tests/CommentsPlatform.Domain.UnitTests/CommentsPlatform.Domain.UnitTests.csproj
          --configuration Release
          --no-build
          --collect "XPlat Code Coverage"
          --settings coverage.runsettings
          --logger "trx;LogFileName=domain-unit-tests.trx"
          --results-directory TestResults/Unit

      - name: Run Application unit tests with coverage
        run: >
          dotnet test
          tests/CommentsPlatform.Application.UnitTests/CommentsPlatform.Application.UnitTests.csproj
          --configuration Release
          --no-build
          --collect "XPlat Code Coverage"
          --settings coverage.runsettings
          --logger "trx;LogFileName=application-unit-tests.trx"
          --results-directory TestResults/Unit

      - name: Run API unit tests with coverage
        run: >
          dotnet test
          tests/CommentsPlatform.Api.UnitTests/CommentsPlatform.Api.UnitTests.csproj
          --configuration Release
          --no-build
          --collect "XPlat Code Coverage"
          --settings coverage.runsettings
          --logger "trx;LogFileName=api-unit-tests.trx"
          --results-directory TestResults/Unit

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner end
          /d:sonar.token="${SONAR_TOKEN}"

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults/Unit/*.trx
          if-no-files-found: warn
          retention-days: 7

  infrastructure-integration-tests:
    name: Infrastructure integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore CommentsPlatform.slnx

      - name: Run Infrastructure integration tests
        run: >
          dotnet test
          tests/CommentsPlatform.Infrastructure.IntegrationTests/CommentsPlatform.Infrastructure.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=infrastructure-integration-tests.trx"
          --results-directory TestResults/Integration

      - name: Upload Infrastructure integration test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: infrastructure-integration-test-results
          path: TestResults/Integration/*.trx
          if-no-files-found: warn
          retention-days: 7

  api-integration-tests:
    name: API integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore CommentsPlatform.slnx

      - name: Run API integration tests
        run: >
          dotnet test
          tests/CommentsPlatform.Api.IntegrationTests/CommentsPlatform.Api.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=api-integration-tests.trx"
          --results-directory TestResults/Integration

      - name: Upload API integration test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-test-results
          path: TestResults/Integration/*.trx
          if-no-files-found: warn
          retention-days: 7
