services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      MSSQL_DB: ${MSSQL_DB:-CommentsPlatform}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "${SQLSERVER_HOST_PORT:-1435}:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${MSSQL_DB:-CommentsPlatform};User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required};TrustServerCertificate=True
      CloudflareTurnstile__SecretKey: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:?CLOUDFLARE_TURNSTILE_SECRET_KEY is required}
      CloudflareTurnstile__ExpectedAction: ${CLOUDFLARE_TURNSTILE_EXPECTED_ACTION:-}
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_HOST_PORT:-4200}
    ports:
      - "${API_HOST_PORT:-5075}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - api-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
  api-uploads:
